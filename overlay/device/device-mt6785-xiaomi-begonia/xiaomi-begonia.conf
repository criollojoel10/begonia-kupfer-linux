MODULES+=(lm36274_bl lm363x-regulator novatek-nvt-ts-spi panel-novatek-nt36672a ti-lmu)

# El panel se enciende desde el initramfs, antes de existir el rootfs, asi que el
# firmware de novatek tiene que estar dentro del initramfs. Sin esto los modulos
# cargan pero no hay imagen (dmesg: "panel ... failed to get regulator" / error
# de request_firmware).
#
# Se dejan los .zst tal cual: el cargador de firmware del kernel prueba
# <nombre>.zst automaticamente porque el config trae
# CONFIG_FW_LOADER_COMPRESS_ZSTD=y (viene del config de pmaports).
#
# Hay dos variantes de panel (csot y tianma) y el DTB 6.16 solo declara la
# csot, asi que se meten las dos. Meter las dos no hace dano: el driver pide
# la suya y el resto se ignora. Con _panel=tianma el paquete de firmware deja
# el binario Tianma tambien bajo el nombre csot, asi que la variante Tianma
# del movil se resuelve desde el propio initramfs.
#
# Rutas explicitas, sin glob, y con /lib/firmware (no /usr/lib/firmware): el
# cargador de firmware busca /lib/firmware/updates* y luego /lib/firmware (ver
# fw_path() en drivers/base/firmware_loader/main.c) y mkinitcpio guarda cada
# elemento de FILES en el cpio con la ruta que se le da, asi que un
# /usr/lib/firmware/... aca dentro acabaria en usr/lib/firmware/... en el
# initramfs, donde el kernel no lo mira. Upstream usa /lib/firmware/qcom/...
# en sus device confs por el mismo motivo.
FILES=(
    /lib/firmware/novatek/nt36672a_begonia_csot.bin.zst
    /lib/firmware/novatek/nt36672a_begonia_tianma.bin.zst
)
