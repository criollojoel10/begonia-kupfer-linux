name: Build kernel 7.1 + conn (begonia, MT6785)

# Kernel 7.1 para begonia = tag 7.1-r0 del tronco (Dinolek) + la serie conn/WiFi
# rebasada + el fix de BTF del MR !8852 de pmaports.
#
# El port conn/WiFi (wlan_gen4m + wmt_drv + mtk-vendor-btif) vive en el fork
# minorum/linux, rama `begonia-conn-wifi`, que cuelga de 6.16.4-r0. Aquí se
# rebasa sobre el tag base y se emite como serie de parches: así el PKGBUILD no
# depende de ninguna rama ajena y el rebase queda reproducido en cada corrida.
#
# NO toca el sistema: solo produce el paquete y los artefactos.
#
# Flujo:
#   1. prepare -> rebase + format-patch (artifact `conn-patches`)
#   2. build   -> overlay + parches -> kupferbootstrap -> paquete linux-mt6785
on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'Tag base del kernel (mt6785-mainline/linux)'
        type: string
        default: '7.1-r0'
      conn_branch:
        description: 'Rama con el port conn/WiFi (minorum/linux)'
        type: string
        default: 'begonia-conn-wifi'
      conn_old_base:
        description: 'Base del port (tag del que cuelga la rama conn)'
        type: string
        default: '6.16.4-r0'

jobs:
  prepare:
    name: Rebase del port conn/WiFi sobre ${{ inputs.base_tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Rebase y export de la serie de parches
        run: |
          set -euo pipefail
          # El rebase reescribe commits: sin identidad, `git rebase --continue`
          # muere con "empty ident name" en el runner (run 39084555322).
          git config --global user.name "begonia-kupfer-ci"
          git config --global user.email "ci@users.noreply.github.com"
          git clone --filter=blob:none --no-checkout --quiet \
            https://gitlab.postmarketos.org/mt6785-mainline/linux.git k
          cd k
          git remote add minorum https://gitlab.postmarketos.org/minorum/linux.git
          git fetch --quiet --filter=blob:none origin \
            "${{ inputs.base_tag }}" "${{ inputs.conn_old_base }}"
          git fetch --quiet --filter=blob:none minorum "${{ inputs.conn_branch }}"
          MB=$(git merge-base "${{ inputs.conn_old_base }}" "minorum/${{ inputs.conn_branch }}")
          echo "merge-base del port: $MB"
          git checkout --quiet --detach "minorum/${{ inputs.conn_branch }}"
          echo "=== rebase --onto ${{ inputs.base_tag }} ==="
          git rebase --onto "${{ inputs.base_tag }}" "$MB" || true

          # --- resolucion de los conflictos conocidos (6.16 -> 7.1) ---
          # drivers/misc/Kconfig y drivers/misc/Makefile: en 7.1 cambiaron las
          # lineas vecinas (rp1, MEMORY_BALLOON y un depends de KEYBOARD_GPIO_POLLED)
          # y la rama conn las *sustituia* en lugar de anadirlas. Se toma el lado
          # 7.1 (--ours en un rebase es el nuevo base) y se anade lo del port.
          i=0
          while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
            i=$((i + 1)); [ "$i" -le 12 ] || { echo "::error::demasiadas iteraciones de rebase"; exit 1; }
            conflicts=$(git diff --name-only --diff-filter=U || true)
            if [ -z "$conflicts" ]; then
              GIT_EDITOR=true git rebase --continue || {
                echo "::error::git rebase --continue fallo sin conflictos pendientes"; exit 1; }
              continue
            fi
            echo "--- conflicto(s): $conflicts ---"
            for f in $conflicts; do
              case "$f" in
                drivers/misc/Kconfig)
                  git checkout --ours -- "$f"
                  grep -q 'mediatek/Kconfig' "$f" || printf '\nsource "drivers/misc/mediatek/Kconfig"\n' >>"$f"
                  ;;
                drivers/misc/Makefile)
                  git checkout --ours -- "$f"
                  grep -q 'mediatek/' "$f" || printf 'obj-$(CONFIG_MTK_WMT_FWPORT)\t+= mediatek/\n' >>"$f"
                  ;;
                *)
                  echo "::error::conflicto no previsto en $f"
                  git diff --diff-filter=U | head -40
                  exit 1
                  ;;
              esac
              git add "$f"
            done
            GIT_EDITOR=true git rebase --continue || true
          done
          echo "=== rebase terminado en $i iteracion(es) ==="
          echo "commits sobre el tag base: $(git rev-list --count ${{ inputs.base_tag }}..HEAD)"
          echo "HEAD: $(git rev-parse HEAD)"
          echo "conn presente: $(git ls-tree -r --name-only HEAD -- drivers/misc/mediatek/connectivity | wc -l) ficheros"
          mkdir -p ../patches
          git format-patch --no-signature -o ../patches "${{ inputs.base_tag }}..HEAD" >/dev/null
          echo "=== parches generados: $(ls ../patches/*.patch | wc -l) ==="
          cd ../patches
          for f in [0-9]*.patch; do mv "$f" "conn-$f"; done
          ls | head -4

      - name: Upload serie de parches
        uses: actions/upload-artifact@v4
        with:
          name: conn-patches
          path: patches/
          if-no-files-found: error
          retention-days: 30

  build:
    name: Compilar linux-mt6785 ${{ inputs.base_tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    needs: prepare
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout port repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip git rsync parted libarchive-tools \
            pahole

      - name: Descargar la serie conn/WiFi
        uses: actions/download-artifact@v4
        with:
          name: conn-patches
          path: overlay/linux/mt6785/patches-in

      - name: Preparar overlay (parches + source del PKGBUILD)
        run: |
          set -euo pipefail
          cd overlay/linux/mt6785
          mv patches-in/*.patch .
          rmdir patches-in
          n=$(ls conn-*.patch | wc -l)
          echo "parches conn: $n"
          test "$n" -ge 40 || { echo "::error::solo $n parches conn (se esperaban ~51)"; exit 1; }
          # expandir los marcadores del PKGBUILD con la lista real de parches
          python3 - <<'PY'
          import glob, pathlib
          p = pathlib.Path("PKGBUILD")
          s = p.read_text()
          names = [pathlib.Path(x).name for x in sorted(glob.glob("conn-*.patch"))]
          s = s.replace("#PATCHES#", "\n    ".join(names))
          s = s.replace("#SUMS#", "\n    ".join("SKIP" for _ in names))
          p.write_text(s)
          print("source actualizado con", len(names), "parches")
          PY
          grep -c "conn-" PKGBUILD

      - name: Registrar sha256 de las fuentes remotas
        run: |
          set -euo pipefail
          echo "== sha256 de las fuentes remotas (trazabilidad) =="
          curl -fsSL --retry 3 -o /tmp/linux.tar.gz \
            "https://gitlab.postmarketos.org/mt6785-mainline/linux/-/archive/${{ inputs.base_tag }}/linux-${{ inputs.base_tag }}.tar.gz"
          sha256sum /tmp/linux.tar.gz
          curl -fsSL --retry 3 -o /tmp/cfg.aarch64 \
            "https://gitlab.postmarketos.org/Dinolek/pmaports/-/raw/ae9d32b76335a995f5187be50d8cfffa30e555cb/device/testing/linux-postmarketos-mediatek-mt6785/config-postmarketos-mediatek-mt6785.aarch64"
          sha256sum /tmp/cfg.aarch64
          rm -f /tmp/linux.tar.gz /tmp/cfg.aarch64

      - name: Checkout kupferbootstrap
        run: |
          git clone --depth 1 --branch dev \
            https://gitlab.com/kupfer/kupferbootstrap.git kupferbootstrap

      - name: Setup Python venv for kupferbootstrap
        working-directory: kupferbootstrap
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -q -e .

      - name: Prepare cache dirs
        id: paths
        run: |
          echo "cache_dir=$HOME/.cache/kupferbootstrap" >> $GITHUB_OUTPUT
          mkdir -p "$HOME/.cache/kupferbootstrap/pkgbuilds" \
                   "$HOME/.cache/kupferbootstrap/packages"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/kupferbootstrap/ccache
          key: ccache-kernel71-${{ github.sha }}
          restore-keys: ccache-kernel71-

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/kupferbootstrap/packages
          key: pkgs-kernel71-${{ github.sha }}
          restore-keys: pkgs-kernel71-

      - name: Generate kupferbootstrap config
        run: |
          mkdir -p $HOME/.config/kupfer
          cat > $HOME/.config/kupfer/kupferbootstrap.toml <<'TOML'
          [wrapper]
          type = "docker"

          [build]
          clean_mode = false
          crosscompile = true
          crossdirect = true
          ccache = true
          threads = 0

          [pkgbuilds]
          git_repo = "https://gitlab.com/kupfer/packages/pkgbuilds.git"
          git_branch = "dev"

          [pacman]
          parallel_downloads = 5
          check_space = false

          [paths]
          cache_dir = "${{ steps.paths.outputs.cache_dir }}"
          pkgbuilds = "${{ steps.paths.outputs.cache_dir }}/pkgbuilds"
          packages = "${{ steps.paths.outputs.cache_dir }}/packages"
          ccache = "${{ steps.paths.outputs.cache_dir }}/ccache"

          [profiles]
          current = "default"

          [profiles.default]
          device = "mt6785-xiaomi-begonia"
          flavour = "plasma-mobile"
          TOML

      - name: Build kupferbootstrap image
        working-directory: kupferbootstrap
        run: |
          docker build --pull --network host \
            -t registry.gitlab.com/kupfer/kupferbootstrap:BUILD .
          docker run --rm registry.gitlab.com/kupfer/kupferbootstrap:BUILD \
            kupferbootstrap --help >/dev/null

      - name: Initialize pkgbuilds (dev)
        working-directory: kupferbootstrap
        run: |
          script -qec ".venv/bin/kupferbootstrap packages init --non-interactive" /dev/null

      - name: Apply kernel overlay
        run: |
          set -euo pipefail
          PDIR="$HOME/.cache/kupferbootstrap/pkgbuilds"
          test -d "$PDIR/.git" || { echo "::error::pkgbuilds no clonado"; exit 1; }
          cp -r "$GITHUB_WORKSPACE/overlay/linux" "$PDIR/"
          test -f "$PDIR/linux/mt6785/PKGBUILD" || { echo "::error::falta linux/mt6785/PKGBUILD"; exit 1; }
          grep -q '^CONFIG_NETFILTER_XT_CONNMARK=m' "$PDIR/linux/mt6785/extra_config" \
            || { echo "::error::extra_config sin CONFIG_NETFILTER_XT_CONNMARK"; exit 1; }
          grep -q '^CONFIG_MTK_WLAN_GEN4M=m' "$PDIR/linux/mt6785/extra_config" \
            || { echo "::error::extra_config sin CONFIG_MTK_WLAN_GEN4M"; exit 1; }
          echo "parches en el overlay: $(ls "$PDIR/linux/mt6785"/conn-*.patch | wc -l)"
          echo "overlay kernel ok"

      - name: Build cross toolchain (x86_64)
        working-directory: kupferbootstrap
        run: |
          script -qec ".venv/bin/kupferbootstrap -v packages build --arch x86_64 cross/aarch64-unknown-linux-gnu-bin" /dev/null
          ls -l "$HOME/.cache/kupferbootstrap/packages/x86_64/cross/" \
            | grep -q 'aarch64-unknown-linux-gnu-bin-.*\.pkg\.tar' \
            || { echo "::error::toolchain aarch64 ausente"; exit 1; }

      - name: Build kernel package
        working-directory: kupferbootstrap
        run: |
          script -qec ".venv/bin/kupferbootstrap -v packages build --arch aarch64 linux/mt6785" /dev/null \
            2>&1 | tee kernel-build.log
          echo "--- log tail ---"; tail -30 kernel-build.log

      - name: Locate artifacts
        id: art
        run: |
          set -euo pipefail
          PD="$HOME/.cache/kupferbootstrap/packages/aarch64"
          PKG=$(find "$PD" -name 'linux-mt6785-[0-9]*.pkg.tar.*' ! -name '*headers*' 2>/dev/null | sort | head -1)
          HDR=$(find "$PD" -name 'linux-mt6785-headers-*.pkg.tar.*' 2>/dev/null | sort | head -1)
          [ -n "$PKG" ] || { echo "::error::no se genero linux-mt6785"; find "$PD" -type f | head -20; exit 1; }
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "hdr=$HDR" >> "$GITHUB_OUTPUT"
          mkdir -p out
          tar -xf "$PKG" -C out boot/Image.gz usr/lib/modules 2>/dev/null || true
          find out -name 'Image.gz' -o -name 'mt6785-xiaomi-begonia*.dtb' | head -5
          ls -l "$PKG" "$HDR" 2>/dev/null

      - name: Verify modulos objetivo (conn/WiFi + netfilter)
        run: |
          set -euo pipefail
          echo "=== modulos conn/WiFi esperados ==="
          for m in wlan_gen4m wmt_drv mtk-vendor-btif; do
            if find out -name "$m.ko*" | grep -q .; then
              echo "OK   $m"; find out -name "$m.ko*" | head -1
            else
              echo "::error::falta $m.ko en el paquete"
              exit 1
            fi
          done
          echo "=== netfilter (Tailscale) ==="
          find out -name 'xt_connmark.ko*' | grep -q . || { echo "::error::falta xt_connmark.ko"; exit 1; }
          echo "OK   xt_connmark"
          echo "=== version del kernel construido ==="
          tar -xOf "${{ steps.art.outputs.hdr }}" usr/lib/modules/*/build/Makefile 2>/dev/null | grep -E "^VERSION|^PATCHLEVEL|^SUBLEVEL" | head -3 || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-mt6785-71-${{ github.run_number }}
          path: |
            ${{ steps.art.outputs.pkg }}
            ${{ steps.art.outputs.hdr }}
            out/boot/Image.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log-${{ github.run_number }}
          path: kupferbootstrap/kernel-build.log
          if-no-files-found: ignore
          retention-days: 7
