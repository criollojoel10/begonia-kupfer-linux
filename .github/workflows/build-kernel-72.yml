name: Build kernel 7.2 + conn (begonia, MT6785)

# Construye SOLO el paquete linux-mt6785 sobre **mainline stable v7.2.11** con:
#   - delta mt6785 rebasado a 7.2.11        (overlay/linux/mt6785/patches-delta, 115)
#   - conn/WiFi rebasado encima             (overlay/linux/mt6785/patches-conn, 51)
#   - adaptaciones de API 7.1 y 7.2         (zz-conn-7.1-api / zz-conn-7.2-api)
#   - nodos DT del conn                     (010-dts-conn-7.2.patch)
#
# A diferencia del workflow de 7.1, aqui NO hay job de rebase: el fork
# mt6785-mainline no tiene tag 7.2, asi que las tres series se generaron una vez
# (local) y viven commiteadas. Asi el build es reproducible sin depender de
# ramas ajenas.
#
# Artefactos: linux-mt6785-<ver>-aarch64.pkg.tar.xz (+ headers) y el log.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-begonia-72-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: "1"

jobs:
  build:
    name: Compilar linux-mt6785 7.2.6-r0
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Info del runner
        run: |
          set -Eeuo pipefail
          df -h | tail -1
          free -h | head -2
          nproc
      - name: Checkout port repo
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Liberar espacio en disco
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h | tail -1
      - name: Instalar dependencias
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip git rsync parted libarchive-tools \
            xz-utils zstd device-tree-compiler cpio bc patch
      - name: Clonar kupferbootstrap
        id: kbs
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch dev \
            https://gitlab.com/kupfer/kupferbootstrap.git kupferbootstrap
          git -C kupferbootstrap rev-parse HEAD
          echo "sha=$(git -C kupferbootstrap rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore imagen docker de kupferbootstrap
        id: kbsimg
        # actions/cache/restore@v4.2.2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/kbs-image.tar
          key: kbs-image-${{ steps.kbs.outputs.sha }}
          restore-keys: |
            kbs-image-
      - name: Restore chroots de kupferbootstrap
        # actions/cache/restore@v4.2.2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/kupferbootstrap/chroots
          key: kbs-chroots-${{ steps.kbs.outputs.sha }}
          restore-keys: |
            kbs-chroots-
      - name: Preparar venv de kupferbootstrap
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -q -e .
      - name: Construir la imagen docker de kupferbootstrap
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          if [ "${{ steps.kbsimg.outputs.cache-hit }}" = "true" ]; then
            echo "imagen desde cache"
            docker load -i ~/kbs-image.tar
          else
            docker build --pull --network host -t registry.gitlab.com/kupfer/kupferbootstrap:BUILD .
            docker save registry.gitlab.com/kupfer/kupferbootstrap:BUILD -o ~/kbs-image.tar
          fi
          docker run --rm registry.gitlab.com/kupfer/kupferbootstrap:BUILD kupferbootstrap --help >/dev/null
      - name: Preparar cache y config
        id: paths
        run: |
          set -Eeuo pipefail
          CD="$HOME/.cache/kupferbootstrap"
          for d in ccache rust chroots jumpdrive pacman packages pkgbuilds images; do
            mkdir -p "$CD/$d"
          done
          echo "cache_dir=$CD" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/.config/kupfer"
          cat > "$HOME/.config/kupfer/kupferbootstrap.toml" <<TOML
          [wrapper]
          type = "docker"

          [build]
          ccache = true
          clean_mode = false
          crosscompile = true
          crossdirect = true
          threads = 0

          [pkgbuilds]
          git_repo = "https://gitlab.com/kupfer/packages/pkgbuilds.git"
          git_branch = "dev"

          [pacman]
          parallel_downloads = 5
          check_space = false

          [paths]
          cache_dir = "$CD"
          chroots = "$CD/chroots"
          jumpdrive = "$CD/jumpdrive"
          pacman = "$CD/pacman"
          packages = "$CD/packages"
          pkgbuilds = "$CD/pkgbuilds"
          images = "$CD/images"
          ccache = "$CD/ccache"
          rust = "$CD/rust"

          [profiles]
          current = "default"

          [profiles.default]
          device = "mt6785-xiaomi-begonia"
          flavour = "plasma-mobile"
          pkgs_include = []
          pkgs_exclude = []
          hostname = "begonia"
          username = "user"

          [ssh]
          username = "user"
          password = "changeme"
          size_extra_mb = 2048
          TOML
      - name: Restore ccache
        # actions/cache/restore@v4.2.2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/kupferbootstrap/ccache
          key: ccache-kernel72-begonia-${{ github.sha }}
          restore-keys: |
            ccache-kernel72-begonia-
      - name: Restore packages (toolchain)
        # actions/cache/restore@v4.2.2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/kupferbootstrap/packages
          key: pkgs-kernel72-begonia-${{ github.sha }}
          restore-keys: |
            pkgs-kernel72-begonia-
      - name: Inicializar pkgbuilds
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          script -qec ".venv/bin/kupferbootstrap packages init --non-interactive" /dev/null
      - name: Aplicar el overlay
        run: |
          set -Eeuo pipefail
          PDIR="$HOME/.cache/kupferbootstrap/pkgbuilds"
          test -d "$PDIR/.git" || { echo "::error::pkgbuilds no clonado"; exit 1; }
          cp -r overlay/linux "$PDIR"/
          test -f "$PDIR/linux/mt6785/PKGBUILD" || { echo "::error::falta linux/mt6785/PKGBUILD"; exit 1; }
          grep -q "cdn.kernel.org" "$PDIR/linux/mt6785/PKGBUILD" \
            || { echo "::error::el PKGBUILD no apunta a mainline (cdn.kernel.org)"; exit 1; }
          grep -qE "^pkgver=7\\.2\\." "$PDIR/linux/mt6785/PKGBUILD" \
            || { echo "::error::pkgver inesperada"; exit 1; }
          nd=$(ls "$PDIR/linux/mt6785"/patches-delta/*.patch 2>/dev/null | wc -l)
          nc=$(ls "$PDIR/linux/mt6785"/patches-conn/*.patch 2>/dev/null | wc -l)
          echo "parches: delta=$nd conn=$nc"
          test "$nd" -ge 110 || { echo "::error::faltan parches delta ($nd)"; exit 1; }
          test "$nc" -ge 45  || { echo "::error::faltan parches conn ($nc)"; exit 1; }
      - name: Construir el toolchain de cruce (x86_64)
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          script -qec ".venv/bin/kupferbootstrap -v packages build --arch x86_64 cross/aarch64-unknown-linux-gnu-bin" /dev/null
          ls -l "$HOME/.cache/kupferbootstrap/packages/x86_64/cross/" | grep -q 'aarch64-unknown-linux-gnu-bin-.*\.pkg\.tar'
      - name: Limpiar paquete del kernel en cache
        # kupferbootstrap se salta el build si el paquete esta en linux.db con
        # checksum intacto (leccion del run 39160497003).
        run: |
          set -Eeuo pipefail
          PD="$HOME/.cache/kupferbootstrap/packages"
          find "$PD" -name 'linux-mt6785-*.pkg.tar.*' -delete 2>/dev/null || true
          echo "paquetes linux-mt6785 tras limpiar: $(find "$PD" -name 'linux-mt6785-*' 2>/dev/null | wc -l)"
      - name: Build kernel package
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          set -o pipefail   # sin esto el '| tee' se come el fallo
          script -qec ".venv/bin/kupferbootstrap -v packages build --arch aarch64 linux/mt6785" /dev/null \
            2>&1 | tee kernel-build.log
          echo "--- log tail ---"; tail -30 kernel-build.log
      - name: Locate artifacts
        id: art
        run: |
          set -Eeuo pipefail
          PD="$HOME/.cache/kupferbootstrap/packages/aarch64/linux"
          PKG=$(find "$PD" -name 'linux-mt6785-[0-9]*.pkg.tar.*' ! -name '*headers*' 2>/dev/null | sort | head -1)
          HDR=$(find "$PD" -name 'linux-mt6785-headers-*.pkg.tar.*' 2>/dev/null | sort | head -1)
          [ -n "$PKG" ] || { echo "::error::no se genero linux-mt6785"; find "$PD" -type f | head -20; exit 1; }
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "hdr=$HDR" >> "$GITHUB_OUTPUT"
          echo "paquete: $(basename "$PKG") ($(stat -c%s "$PKG") bytes)"
          tar -tJf "$PKG" | grep -E '^boot/(Image.gz|dtbs/mediatek/)' | head -6
      - name: Verify modulos objetivo (conn/WiFi + netfilter)
        run: |
          set -Eeuo pipefail
          # OJO: nada de `printf "$LIST" | grep -q`: grep -q cierra el pipe al
          # primer match, printf muere por SIGPIPE y con pipefail el pipeline
          # cuenta como fallo (run 39347842777 marco "falta" con el paquete OK).
          PKG="${{ steps.art.outputs.pkg }}"
          tar -tJf "$PKG" > /tmp/pkglist.txt
          echo "entradas en el paquete: $(wc -l < /tmp/pkglist.txt)"
          FAIL=0
          for m in wlan_gen4m wmt_drv mtk-vendor-btif xt_connmark; do
            if grep -q "/$m\.ko$" /tmp/pkglist.txt; then
              echo "OK: $m.ko"
            else
              echo "::error::falta $m.ko en el paquete"
              FAIL=1
            fi
          done
          grep -q 'mt6785-xiaomi-begonia-csot.dtb' /tmp/pkglist.txt \
            || { echo "::error::falta el DTB csot"; FAIL=1; }
          grep -qE 'mt6785-xiaomi-begonia\.dtb$' /tmp/pkglist.txt \
            || { echo "::error::falta el alias de DTB"; FAIL=1; }
          echo "--- modulos conn/wifi presentes ---"
          grep -E "/(wlan_gen4m|wmt_drv|mtk-vendor-btif|xt_connmark)\.ko$" /tmp/pkglist.txt || true
          [ "$FAIL" = 0 ] || exit 1
      - name: Upload artifacts
        if: ${{ always() && steps.art.outputs.pkg != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-mt6785-72-${{ github.run_number }}
          path: |
            ${{ steps.art.outputs.pkg }}
            ${{ steps.art.outputs.hdr }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-build-log-72-${{ github.run_number }}
          path: kupferbootstrap/kernel-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save ccache (siempre)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/kupferbootstrap/ccache
          key: ccache-kernel72-begonia-${{ github.sha }}
