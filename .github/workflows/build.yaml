name: Build Kupfer Linux (begonia - Plasma Mobile)

on:
  workflow_dispatch:
    inputs:
      flavour:
        description: 'Flavour (plasma-mobile, phosh, etc.)'
        required: false
        default: 'plasma-mobile'
      size_extra_mb:
        description: 'Extra size MB for rootfs'
        required: false
        default: '2048'
      crosscompile:
        description: 'Crosscompile'
        type: boolean
        required: false
        default: true
      crossdirect:
        description: 'Crossdirect'
        type: boolean
        required: false
        default: true
      clean_mode:
        description: 'Reset chroot before building (slow, use only when suspecting a broken chroot)'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      # El Dockerfile de kupferbootstrap usa sintaxis labs: RUN --mount=type=bind
      # y ADD --link, que requieren BuildKit. Sin esto `docker build` falla.
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Checkout port repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up paths
        id: paths
        run: |
          echo "cache_dir=$HOME/.cache/kupferbootstrap" >> $GITHUB_OUTPUT
          echo "pkgbuilds_dir=$HOME/.cache/kupferbootstrap/pkgbuilds" >> $GITHUB_OUTPUT
          echo "images_dir=$HOME/.cache/kupferbootstrap/images" >> $GITHUB_OUTPUT

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip git rsync parted libarchive-tools \
            android-tools-adb android-tools-fastboot

      - name: Checkout kupferbootstrap
        run: |
          # kupferbootstrap vive en GitLab, no en GitHub: actions/checkout no sirve.
          git clone --depth 1 --branch dev \
            https://gitlab.com/kupfer/kupferbootstrap.git kupferbootstrap

      - name: Fit the boot image in begonia's 64 MiB boot partition
        working-directory: kupferbootstrap
        run: |
          # begonia guarda el kernel en la particion hardware `boot`, que en el
          # device real es sdc34 = 64 MiB. kupferbootstrap dimensiona el
          # filesystem de boot con IMG_FILE_BOOT_DEFAULT_SIZE, fijo a "90M" y sin
          # ninguna clave de deviceinfo para cambiarlo, asi que el boot.img que
          # produce no cabe y `fastboot flash boot` falla con "too large".
          #
          # Nuestro contenido real (medido sobre la imagen del run 36254913777):
          #   aboot.img 27.7 MiB + initramfs-linux.img 17.0 MiB
          #   + Image.gz 10.6 MiB + dtb 0.06 MiB + empty.dtbo = 52.8 MiB
          # 60M deja ~6 MiB de holgura para la metadata de ext2 y para que el
          # initramfs crezca un poco sin reventar. El patch se aplica al clon
          # local, que es a la vez el contexto de `docker build` (el Dockerfile
          # hace ADD src + pip install -e) y el source del venv local, asi que
          # vale para los dos caminos.
          sed -i 's/^IMG_FILE_BOOT_DEFAULT_SIZE = "90M"$/IMG_FILE_BOOT_DEFAULT_SIZE = "60M"/' \
            src/kupferbootstrap/image/image.py
          grep -q '^IMG_FILE_BOOT_DEFAULT_SIZE = "60M"$' src/kupferbootstrap/image/image.py \
            || { echo "::error::no se ha podido ajustar IMG_FILE_BOOT_DEFAULT_SIZE"; exit 1; }
          grep -n 'IMG_FILE_BOOT_DEFAULT_SIZE' src/kupferbootstrap/image/image.py

      - name: Setup Python venv for kupferbootstrap
        working-directory: kupferbootstrap
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .

      - name: Prepare cache dirs
        run: |
          mkdir -p "${{ steps.paths.outputs.cache_dir }}"
          mkdir -p "${{ steps.paths.outputs.cache_dir }}/ccache"
          mkdir -p "${{ steps.paths.outputs.cache_dir }}/rust"
          mkdir -p "${{ steps.paths.outputs.cache_dir }}/chroots"
          mkdir -p "${{ steps.paths.outputs.cache_dir }}/jumpdrive"
          mkdir -p "${{ steps.paths.outputs.cache_dir }}/pacman"
          mkdir -p "${{ steps.paths.outputs.cache_dir }}/packages"
          mkdir -p "${{ steps.paths.outputs.pkgbuilds_dir }}"
          mkdir -p "${{ steps.paths.outputs.images_dir }}"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ steps.paths.outputs.cache_dir }}/ccache
          key: ccache-kupfer-begonia-${{ inputs.flavour }}-${{ github.run_id }}
          restore-keys: |
            ccache-kupfer-begonia-${{ inputs.flavour }}-
            ccache-kupfer-begonia-

      # OJO, sin restore-keys a proposito.
      #
      # kupferbootstrap NO reinstala desde cero: busca cada paquete en el repo
      # local ($cache_dir/packages) y, si lo encuentra con el checksum que
      # espera, lo da por bueno sin reconstruir. Con el restore-keys por prefijo
      # de antes, cada run se colgaba los paquetes del ultimo run verde aunque
      # hubiesen cambiado los PKGBUILD del overlay (el pkgver/pkgrel no siempre
      # se tocan), y se acababa instalando en la imagen un paquete viejo. Asi
      # paso: el build de 72ebbfd construyo firmware-mt6785-xiaomi-begonia-0.1-3
      # pero instalo firmware-mediatek-mt6785-0.1-2, que es de antes del rename
      # y no lleva el firmware del panel -> initramfs sin el .zst del tactil.
      #
      # Losing la cache solo obliga a recompilar el kernel propio; el
      # cross-toolchain y los prebuilts de upstream se descargan igual de la red.
      # ccache (que si tiene restore-keys) hace que esa recompilacion sea rapida.
      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.paths.outputs.cache_dir }}/packages
          key: pkg-kupfer-begonia-${{ inputs.flavour }}-${{ hashFiles('overlay/**') }}

      - name: Generate kupferbootstrap config
        run: |
          mkdir -p $HOME/.config/kupfer
          cat > $HOME/.config/kupfer/kupferbootstrap.toml <<'TOML'
          [wrapper]
          # kupferbootstrap construye Arch packages con makepkg: no se puede
          # usar type="none" sobre un runner Ubuntu (makepkg: command not found).
          # type="docker" usa la imagen oficial (archlinux:base-devel + toolchain).
          type = "docker"

          [build]
          ccache = true
          clean_mode = ${{ inputs.clean_mode }}
          crosscompile = ${{ inputs.crosscompile }}
          crossdirect = ${{ inputs.crossdirect }}
          threads = 0

          [pkgbuilds]
          git_repo = "https://gitlab.com/kupfer/packages/pkgbuilds.git"
          git_branch = "dev"

          [pacman]
          # int, no bool: el esquema declara parallel_downloads como int y
          # pacman.conf rechaza un booleano con
          # "invalid value for 'ParallelDownloads' : 'True'".
          parallel_downloads = 5
          check_space = false

          [paths]
          cache_dir = "${{ steps.paths.outputs.cache_dir }}"
          chroots = "${{ steps.paths.outputs.cache_dir }}/chroots"
          jumpdrive = "${{ steps.paths.outputs.cache_dir }}/jumpdrive"
          pacman = "${{ steps.paths.outputs.cache_dir }}/pacman"
          packages = "${{ steps.paths.outputs.cache_dir }}/packages"
          pkgbuilds = "${{ steps.paths.outputs.pkgbuilds_dir }}"
          images = "${{ steps.paths.outputs.images_dir }}"
          ccache = "${{ steps.paths.outputs.cache_dir }}/ccache"
          rust = "${{ steps.paths.outputs.cache_dir }}/rust"

          [profiles]
          current = "default"

          [profiles.default]
          device = "mt6785-xiaomi-begonia"
          flavour = "${{ inputs.flavour }}"
          pkgs_include = []
          pkgs_exclude = []
          hostname = "begonia"
          username = "joel"
          password = "1234"
          size_extra_mb = ${{ inputs.size_extra_mb }}
          TOML

      - name: Validate config against kupferbootstrap schema
        working-directory: kupferbootstrap
        run: |
          # Falla aqui y no 4 minutos despues si el TOML no encaja con el esquema.
          .venv/bin/python - <<'PY'
          import sys
          if sys.version_info >= (3, 11):
              import tomllib as toml_reader
          else:
              import tomli as toml_reader
          from kupferbootstrap.config.scheme import Config

          with open("/home/runner/.config/kupfer/kupferbootstrap.toml", "rb") as f:
              d = toml_reader.load(f)

          # El gate de esquema NO alcanza para detectar bool-vs-int: en Python
          # True es un int valido, asi que "clean_mode = true" y
          # "parallel_downloads = true" pasaban la validacion y rompian mas
          # tarde (pacman.conf: invalid value for 'ParallelDownloads').
          # Estos campos los interpola el workflow, asi que son los que pueden
          # cambiar de tipo sin avisar. type() y no isinstance() a proposito.
          STRICT = {
              ("build", "clean_mode"): bool,
              ("build", "crosscompile"): bool,
              ("build", "crossdirect"): bool,
              ("build", "ccache"): bool,
              ("build", "threads"): int,
              ("pacman", "parallel_downloads"): int,
              ("pacman", "check_space"): bool,
              ("profiles", "default", "size_extra_mb"): int,
          }
          bad = []
          for path, want in STRICT.items():
              cur = d
              for part in path:
                  if not isinstance(cur, dict) or part not in cur:
                      cur = None
                      break
                  cur = cur[part]
              if cur is None:
                  bad.append(f"{'.'.join(path)}: ausente")
              elif type(cur) is not want:
                  bad.append(
                      f"{'.'.join(path)}: es {type(cur).__name__} ({cur!r}), "
                      f"se esperaba {want.__name__}"
                  )
          if bad:
              print("::error::tipos incorrectos en kupferbootstrap.toml:")
              for line in bad:
                  print("  -", line)
              sys.exit(1)

          c = Config.fromDict(d, validate=True, allow_extra=True)
          p = c.profiles.default
          print("config ok:", c.profiles.current, p.device, p.flavour)
          assert p.device == "mt6785-xiaomi-begonia", p.device
          assert type(c.pacman.parallel_downloads) is int, c.pacman.parallel_downloads
          assert type(c.build.clean_mode) is bool, c.build.clean_mode
          PY

      - name: Build kupferbootstrap image
        working-directory: kupferbootstrap
        run: |
          # Precalentar la imagen aqui: falla de forma legible y deja las capas
          # en la cache de BuildKit, para que el wrapper no reconstruya desde cero.
          docker build --pull --network host -t registry.gitlab.com/kupfer/kupferbootstrap:BUILD .
          docker run --rm registry.gitlab.com/kupfer/kupferbootstrap:BUILD kupferbootstrap --help >/dev/null
          echo "kupferbootstrap image lista"

      - name: Initialize pkgbuilds (dev)
        working-directory: kupferbootstrap
        run: |
          # El wrapper ejecuta `docker run -it`; sin TTY real docker aborta con
          # "the input device is not a TTY". `script` aporta una pseudotty.
          script -qec ".venv/bin/kupferbootstrap packages init --non-interactive" /dev/null

      - name: Apply overlays (port repo)
        run: |
          set -euo pipefail
          OVERLAY_DIR="${{ github.workspace }}/overlay"
          PDIR="${{ steps.paths.outputs.pkgbuilds_dir }}"
          # El repo pkgbuilds debe existir antes de sobrecribir (verificado en run previo).
          test -d "$PDIR/.git" || { echo "::error::pkgbuilds no clonado en $PDIR"; exit 1; }
          # El overlay es un ESPEJO del arbol de pkgbuilds (linux/mt6785,
          # firmware/mt6785-xiaomi-begonia, device/device-mt6785-xiaomi-begonia,
          # boot/android-bootimg-updater, main/mkbootimg-git), no un directorio
          # plano de paquetes. Gracias a eso el MR contra KupferLinux/pkgbuilds
          # es exactamente `cp -r overlay/* <checkout>/` y no puede divergir de
          # lo que se ha construido aqui.
          # `cp -r overlay/* pdbuilds/` fusiona cada directorio encima del
          # paquete real de upstream: los ficheros que el overlay no trae
          # (91-android-bootimg-updater.hook, android-bootimg-updater.install)
          # se conservan del checkout, y los que si trae se sobrescriben.
          cp -r "$OVERLAY_DIR"/* "$PDIR"/
          # Sin esto los overlays se perderían en silencio y el build usaría stock.
          for f in device/device-mt6785-xiaomi-begonia/PKGBUILD \
                   device/device-mt6785-xiaomi-begonia/empty.dtbo \
                   linux/mt6785/PKGBUILD \
                   firmware/mt6785-xiaomi-begonia/PKGBUILD \
                   boot/android-bootimg-updater/PKGBUILD \
                   boot/android-bootimg-updater/update-bootimg.sh \
                   main/mkbootimg-git/PKGBUILD; do
            test -f "$PDIR/$f" || { echo "::error::overlay ausente: $f"; exit 1; }
            echo "overlay ok: $f"
          done
          # El parche de --recovery_dtbo y el binario empty.dtbo son los dos
          # motivos por los que existe este port; si uno se pierde, begonia no
          # arranca. Se comprueba aqui y no confiar en el diff.
          grep -q 'recovery_dtbo' "$PDIR/boot/android-bootimg-updater/update-bootimg.sh" \
            || { echo "::error::el update-bootimg overlay no soporta --recovery_dtbo"; exit 1; }
          echo "empty.dtbo: $(sha256sum "$PDIR/device/device-mt6785-xiaomi-begonia/empty.dtbo" | cut -d' ' -f1)"
          test "$(sha256sum "$PDIR/device/device-mt6785-xiaomi-begonia/empty.dtbo" | cut -d' ' -f1)" \
               = f72e1df52c33bde1676863a21b3e7f8c3cb9a21b8ed7addefe2ac0eb8cce0635 \
            || { echo "::error::empty.dtbo no es el de pmaports (136 bytes, magic MTK)"; exit 1; }
          # El prebuilt de boot-android-bootimg-updater no trae el parche, asi que
          # el pkgrel del PKGBUILD overlaid tiene que seguir siendo distinto al
          # del prebuilt (0.5-1) para que se construya localmente.
          grep -qE '^pkgrel=2$' "$PDIR/boot/android-bootimg-updater/PKGBUILD" \
            || { echo "::error::pkgrel del boot updater debe ser 2 para ganar al prebuilt"; exit 1; }
          echo "boot updater: se construira localmente (pkgrel=2 != prebuilt 0.5-1)"
          # El parche de la division entera de mkbootimg-git es lo que permite que
          # --recovery_dtbo escriba una cabecera de boot v2 utilizable. Sin el, el
          # hook 91-android-bootimg-updater falla con "struct.error: required
          # argument is not an integer" y la imagen sale sin aboot.img.
          grep -qF '(image_size + page_size - 1) // page_size' \
            "$PDIR/main/mkbootimg-git/PKGBUILD" \
            || { echo "::error::el overlay de mkbootimg-git no lleva el fix de la division"; exit 1; }
          grep -qE '^pkgrel=3$' "$PDIR/main/mkbootimg-git/PKGBUILD" \
            || { echo "::error::pkgrel de mkbootimg-git debe ser 3 para ganar al prebuilt (2)"; exit 1; }
          echo "mkbootimg-git: se construira localmente (pkgrel=3 != prebuilt 2)"

      - name: packages check (formato de los PKGBUILD)
        working-directory: kupferbootstrap
        run: |
          # La guia de porting de Kupfer exige `kupferbootstrap packages check`
          # limpio antes de abrir el MR, y el propio CI de upstream lo corre con
          # --ci-mode. Son unos segundos (no compila nada) y evita que un
          # PKGBUILD mal formado llegue a makepkg 20 minutos despues.
          script -qec ".venv/bin/kupferbootstrap -v packages check --ci-mode \
            device-mt6785-xiaomi-begonia linux-mt6785 firmware-mt6785-xiaomi-begonia \
            boot-android-bootimg-updater mkbootimg-git" /dev/null

      - name: Build cross toolchain (x86_64)
        working-directory: kupferbootstrap
        run: |
          # EL paso que faltaba, y que el CI de upstream hace explicitly:
          #   kupferbootstrap -v packages build --arch 'x86_64' cross/*/PKGBUILD
          # (primera linea de `script:` en kupfer/packages/pkgbuilds .gitlab-ci.yml).
          #
          # Por que es imprescindible: el toolchain de cruce no viene de Arch, lo
          # aporta el pkgbuild local `cross/aarch64-unknown-linux-gnu-bin`
          # (ALARM x-tools 14.1.1, arch=(x86_64)), que *proporciona* el nombre
          # `aarch64-unknown-linux-gnu-gcc`. Ese pkgbuild no lo declara ningun
          # paquete como dependencia, asi que la cadena de dependencias de
          # `image build` nunca lo mete, y el repo local x86_64/cross queda
          # vacio (init_local_repo() crea un db.tar.xz de cero).
          # Al compilar un paquete `_mode=cross`, packages/build.py:735 hace
          #   pacman -S ... aarch64-unknown-linux-gnu-gcc
          # con allow_fail=True (default), asi que el "target not found" se
          # come en silencio y solo revienta despues, en make olddefconfig, como
          # `C compiler 'aarch64-unknown-linux-gnu-gcc' not found`.
          # Upstream no lo nota porque todos sus paquetes aarch64 llegan como
          # prebuilt de gitlab.com/kupfer/packages/prebuilts y no se compilan.
          # Nosotros si compilamos (kernel, firmware, device, boot updater).
          #
          # `--arch x86_64` es obligatorio: sin el, packages/cli.py:116 usa la
          # arch del device (aarch64) y el paquete se rechaza por arch.
          script -qec ".venv/bin/kupferbootstrap -v packages build --arch x86_64 cross/aarch64-unknown-linux-gnu-bin" /dev/null
          # Falla aqui y legible si el paquete no acaba en el repo local.
          ls -l "${{ steps.paths.outputs.cache_dir }}/packages/x86_64/cross/" \
            | grep -q 'aarch64-unknown-linux-gnu-bin-.*\.pkg\.tar' \
            || { echo "::error::el toolchain aarch64 no esta en el repo local x86_64/cross"; exit 1; }
          echo "toolchain aarch64 presente en el repo local"

      - name: Build image
        working-directory: kupferbootstrap
        run: |
          # kupferbootstrap/net/ssh.py:115 copy_ssh_keys() hace
          #   if len(keys) == 0: click.confirm("Do you want me to generate an ssh key for you?", True)
          # y click.confirm LEE DE STDIN. En un runner de GHA no hay nadie
          # tecleando, asi que el proceso se queda bloqueado para siempre: el
          # run 36244913341 se paso 45 minutos asi, despues de compilar kernel e
          # instalar los 756 paquetes, colgado justo en
          #   WARNING: Could not find any ssh key to copy
          # En local nadie lo ve porque cualquier dev tiene ya un ~/.ssh/id_*.
          # Creando una clave aqui, find_ssh_keys() la encuentra y nunca se llega
          # al confirm. De regalo, la publica acaba en el authorized_keys del
          # usuario de la imagen.
          command -v ssh-keygen >/dev/null || {
            echo "::error::ssh-keygen no esta disponible (falta openssh-client)"; exit 1; }
          mkdir -p ~/.ssh
          [ -f ~/.ssh/id_ed25519_kupfer ] || \
            ssh-keygen -t ed25519 -N '' -C 'kupfer-begonia-build' -f ~/.ssh/id_ed25519_kupfer
          ls -l ~/.ssh/id_ed25519_kupfer*
          set -o pipefail
          script -qec ".venv/bin/kupferbootstrap -v image build --sector-size 4096" /dev/null 2>&1 \
            | tee build-image.log
          test -s build-image.log || { echo "::error::build-image.log vacio"; exit 1; }
          # El hook 91-android-bootimg-updater se come sus errores: pacman
          # registra un aviso, sigue con los 31 hooks y el build termina "bien"
          # con una imagen sin aboot.img, que no arranca. El unico sitio donde se
          # ve es el log.
          #
          # OJO: no se puede comprobar con "error: command failed to execute
          # correctly", porque en el BUILD chroot (aarch64, antes de que existan
          # el paquete device) salen 4 fallos BENIGNOS:
          #   * hooks 6/8 y 7/8: mkinitcpio con el /etc/mkinitcpio.conf de stock
          #     pide el modulo crypto_lz4 (hook systemd) y nuestro config del
          #     kernel no lo trae -> "==> ERROR: module not found: crypto_lz4".
          #     El initramfs que se arranca es el de la ROOTFS, que se genera
          #     con el mkinitcpio.conf que pone kupfer (hooks sin systemd) y
          #     sale limpio ("Initcpio image generation successful").
          #   * hook 8/8: "No deviceinfo found at /etc/kupfer/deviceinfo" (aun
          #     no esta instalado el paquete device en el build chroot).
          #   * hook 18/31: PackageKit "Error connecting: Could not connect".
          # Asi que se comprueba lo que TIENE que ser cierto, no lo que no.
          if grep -aq 'struct\.error' build-image.log; then
            echo "::error::mkbootimg ha fallado generando aboot.img (traza mas arriba)"
            exit 1
          fi
          grep -aq 'Initcpio image generation successful' build-image.log || {
            echo "::error::el initramfs de la rootfs no se ha generado bien"; exit 1; }
          grep -aq 'Generating new aboot.img' build-image.log || {
            echo "::error::aboot.img no se ha generado"; exit 1; }
          ls -l "${{ steps.paths.outputs.images_dir }}"
          # Extraer aboot.img (94 MB) de la particion boot y subirlo como
          # artifact: permite reflashear solo el boot en segundos en vez de
          # volver a bajar y flashear la imagen de 7 GB.
          # IMPORTANTE: la tabla de particiones msdos se creo sobre un loop
          # device con -b 4096 (image.py: losetup -f -b 4096 -P), asi que
          # leerla con los 512 bytes por sector por defecto daria offsets
          # erroneos. Por eso el -b 4096 tambien aqui.
          IMG=$(ls -1 "${{ steps.paths.outputs.images_dir }}"/*-full.img 2>/dev/null | head -1)
          if [ -z "$IMG" ]; then
            echo "::error::no se encuentra la imagen full"; exit 1
          fi
          MNT=/tmp/kupfer-boot
          sudo mkdir -p "$MNT"
          LOOP=$(sudo losetup -f --show -b 4096 -P "$IMG")
          sudo partprobe "$LOOP" || true
          for i in $(seq 1 30); do [ -e "${LOOP}p1" ] && break; sleep 0.5; done
          sudo mount -o ro "${LOOP}p1" "$MNT"
          sudo cp "$MNT/aboot.img" "$MNT/initramfs-linux.img" \
            "${{ steps.paths.outputs.images_dir }}/"
          sudo umount "$MNT"
          sudo losetup -d "$LOOP"
          # mkinitcpio genera el initramfs con umask 077, de modo que el cp con
          # sudo lo deja como root con modo 600 y el usuario del runner no
          # puede ni leerlo. Sin esto, gzip responde "Permission denied" y el
          # check de abajo da los 5 modulos por ausentes aunque esten dentro
          # (falso positivo en el run 36252944105).
          sudo chown "$(id -u):$(id -g)" \
            "${{ steps.paths.outputs.images_dir }}/aboot.img" \
            "${{ steps.paths.outputs.images_dir }}/initramfs-linux.img"
          sudo chmod 0644 \
            "${{ steps.paths.outputs.images_dir }}/aboot.img" \
            "${{ steps.paths.outputs.images_dir }}/initramfs-linux.img"
          ls -l "${{ steps.paths.outputs.images_dir }}"/aboot.img \
                 "${{ steps.paths.outputs.images_dir }}"/initramfs-linux.img
          # El initramfs de mkinitcpio NO es un unico fichero comprimido. El
          # mkinitcpio que trae Arch concatena un CPIO temprano SIN comprimir
          # delante del archivo comprimido (mkinitcpio:385-399, para no
          # comprimir dos veces los ficheros que ya vienen comprimidos), y el
          # kernel acepta los dos segmentos seguidos. Por eso
          #   gzip -dc initramfs-linux.img
          # responde "not in gzip format" con un initramfs perfectamente
          # bueno (asi fallo el run 36253998953).
          #
          # Estos 5 modulos son los del panel y el tactil: sin ellos la
          # pantalla no se enciende en el primer arranque, por eso van en
          # deviceinfo_modules_initfs. Se comprueban sobre el contenido
          # descomprimido, porque los nombres de fichero del CPIO newc van
          # en claro.
          python3 - "${{ steps.paths.outputs.images_dir }}/initramfs-linux.img" <<'PY'
          import sys, zlib

          MODS = ["novatek-nvt-ts-spi", "ti-lmu", "lm363x-regulator",
                  "panel-novatek-nt36672a", "lm36274_bl"]
          # Y el firmware del tactil. El driver pide "novatek/nt36672a_begonia_csot.bin"
          # tal cual (firmware-name del DTB) y lo carga desde el initramfs: si el
          # binario no esta dentro, el panel se enciende pero el touch no existe.
          # En una unidad Tianma el nombre CSOT debe contener el binario Tianma
          # (lo hace el paquete de firmware, _panel=tianma).
          FW = ["nt36672a_begonia_csot.bin.zst",
                "nt36672a_begonia_tianma.bin.zst"]

          data = open(sys.argv[1], "rb").read()
          # el CPIO temprano, si lo hay, termina con su entrada TRAILER!!!
          trailer = data.find(b"TRAILER!!!")
          head = data[:trailer] if trailer >= 0 else b""
          # y a partir de ahi, saltando el relleno, empieza el flujo comprimido
          start = trailer if trailer >= 0 else 0
          body = b""
          gz = data.find(b"\x1f\x8b\x08", start)
          if gz >= 0:
              try:
                  body = zlib.decompressobj(16 + zlib.MAX_WBITS).decompress(data[gz:])
              except zlib.error as e:
                  print("::error::no se ha podido descomprimir el initramfs: %s" % e)
                  sys.exit(1)
          else:
              print("::warning::el initramfs no tiene un flujo gzip detectable")
              body = data[start:]

          print("initramfs: %d bytes | cpio temprano: %d | cuerpo: %d"
                % (len(data), len(head), len(body)))
          missing = [m for m in MODS if m.encode() not in head + body]
          if missing:
              print("::error::faltan modulos en el initramfs: %s" % " ".join(missing))
              sys.exit(1)
          print("initramfs ok: los %d modulos de panel/tactil estan dentro" % len(MODS))
          # El cpio de mkinitcpio guarda los nombres tal cual (no con sufijo de
          # compresion), asi que el .zst tiene que aparecer en la lista.
          miss_fw = [f for f in FW if f.encode() not in head + body]
          if miss_fw:
              print("::error::falta el firmware del panel en el initramfs: %s"
                    % " ".join(miss_fw))
              sys.exit(1)
          # Y que el nombre CSOT sea realmente el Tianma: si el cp metió el
          # CSOT, el touch sale con los ejes cruzados sin decir nada en el log.
          print("firmware del panel en el initramfs: %d ficheros" % len(FW))
          PY

      # El initramfs se genera dentro de la imagen, asi que cuando el check de
      # arriba falla no se sabe si el fallo es (a) que /etc/mkinitcpio.conf no
      # trae los FILES, (b) que los .zst no estan en el rootfs o (c) que el
      # nombre CSOT no contiene el binario Tianma. Este paso monta la rootfs de
      # la imagen final y mira las tres cosas por separado, que es donde se ve
      # la causa de verdad. En el run 36288864029 la causa fue (b): la cache de
      # paquetes de GHA instalo un firmware-mediatek-mt6785 viejo (anterior al
      # rename) que no lleva los blobs de novatek.
      - name: Verify the rootfs (mkinitcpio.conf + panel firmware + package names)
        run: |
          set -o pipefail
          IMG=$(ls -1 "${{ steps.paths.outputs.images_dir }}"/*-full.img 2>/dev/null | head -1)
          [ -n "$IMG" ] || { echo "::error::no se encuentra la imagen full"; exit 1; }
          LOOP=$(sudo losetup -f --show -b 4096 -P "$IMG")
          sudo partprobe "$LOOP" || true
          sleep 2
          MNT=/tmp/kupfer-root
          sudo mkdir -p "$MNT"
          ROOTP=""
          for p in "${LOOP}"p*; do
            # ro a secas falla si ext4 se desmonto sin limpiar el journal
            # (la imagen se acaba de ensamblar); noload lo salta.
            sudo mount -o ro "$p" "$MNT" 2>/dev/null \
              || sudo mount -o ro,noload "$p" "$MNT" 2>/dev/null || continue
            if [ -f "$MNT/etc/kupfer/deviceinfo" ]; then ROOTP="$p"; break; fi
            sudo umount "$MNT"
          done
          if [ -z "$ROOTP" ]; then
            sudo umount "$MNT" 2>/dev/null || true
            sudo losetup -d "$LOOP"
            echo "::error::no se encuentra la particion con /etc/kupfer/deviceinfo"; exit 1
          fi
          echo "rootfs: $ROOTP"

          # (a) el conf que mkinitcpio-overwrite genero
          echo "--- /etc/mkinitcpio.conf (FILES/HOOKS) ---"
          sudo grep -E '^(FILES|HOOKS|MODULES)=' "$MNT/etc/mkinitcpio.conf" || true
          miss=0
          for f in nt36672a_begonia_csot.bin.zst nt36672a_begonia_tianma.bin.zst; do
            sudo grep -q "$f" "$MNT/etc/mkinitcpio.conf" || {
              echo "::error::/etc/mkinitcpio.conf no menciona $f"; miss=1; }
          done

          # (b) los .zst en el rootfs
          echo "--- /usr/lib/firmware/novatek ---"
          sudo ls -l "$MNT/usr/lib/firmware/novatek/" || {
            echo "::error::no hay /usr/lib/firmware/novatek en la imagen"; miss=1; }
          for f in nt36672a_begonia_csot.bin.zst nt36672a_begonia_tianma.bin.zst; do
            [ -f "$MNT/usr/lib/firmware/novatek/$f" ] || {
              echo "::error::falta $f en el rootfs"; miss=1; }
          done
          # (c) el nombre CSOT debe contener el binario Tianma (md5 7d67c2e9...)
          got=$(sudo md5sum "$MNT/usr/lib/firmware/novatek/nt36672a_begonia_csot.bin.zst" 2>/dev/null \
                | cut -d' ' -f1 || true)
          echo "md5 del nombre CSOT: ${got:-<none>}"
          if [ "$got" != "7d67c2e9167f1a630576c177c1b831f7" ]; then
            echo "::error::el nombre CSOT no contiene el binario Tianma"; miss=1
          fi

          # (d) los nombres de paquete: si aparece alguno viejo (pre-rename) es
          # que la cache de packages de GHA sirvio un paquete obsoleto.
          echo "--- paquetes de begonia instalados ---"
          sudo ls "$MNT/var/lib/pacman/local/" | grep -E 'begonia|mediatek-mt6785' || true
          if sudo ls "$MNT/var/lib/pacman/local/" | grep -q 'firmware-mediatek-mt6785'; then
            echo "::error::la imagen trae firmware-mediatek-mt6785 (nombre viejo, pre-rename)"; miss=1
          fi

          # (e) los blobs del stack MediaTek DENTRO de la imagen, no solo dentro
          # del paquete. El paso anterior comprueba el .pkg.tar.xz; esto comprueba
          # que ese paquete llego de verdad al rootfs. Son dos cosas distintas: un
          # paquete bien construido que no se instala deja la imagen verde y sin
          # un solo blob en /usr/lib/firmware/mediatek/, y entonces wlan_gen4m no
          # puede pedir firmware y wlan0 no aparece nunca. Es el mismo fallo que
          # se comio la imagen de pmOS del run 36304158010.
          echo "--- /usr/lib/firmware/mediatek (en la imagen, no en el paquete) ---"
          sudo ls -l "$MNT/usr/lib/firmware/mediatek/" || {
            echo "::error::no hay /usr/lib/firmware/mediatek en la imagen"; miss=1; }
          for f in WIFI_RAM_CODE_soc1_0_2a_1.bin.zst WMT_SOC.cfg.zst \
                   soc1_0_patch_mcu_2a_1_hdr.bin.zst soc1_0_ram_bt_2a_1_hdr.bin.zst \
                   soc1_0_ram_mcu_2a_1_hdr.bin.zst soc1_0_ram_wifi_2a_1_hdr.bin.zst \
                   wifi.cfg.zst; do
            [ -s "$MNT/usr/lib/firmware/mediatek/$f" ] || {
              echo "::error::falta o vacio /usr/lib/firmware/mediatek/$f en la imagen (el wifi interno no cargara firmware)"; miss=1; }
          done
          # Y que la version instalada del paquete de firmware sea la del
          # pkgrel actual, no una anterior que se hubiera quedado en la cache.
          sudo ls "$MNT/var/lib/pacman/local/" | grep -E '^firmware-mt6785-xiaomi-begonia-' \
            || { echo "::error::firmware-mt6785-xiaomi-begonia no esta instalado"; miss=1; }

          sudo umount "$MNT"
          sudo losetup -d "$LOOP"
          exit "$miss"

      - name: Verify kernel modules and firmware in the image
        run: |
          # Sin esto el build sale verde con el kernel mal configurado y el
          # fallo aparece con el movil en la mano. Comprueba el PAQUETE del
          # kernel (no hace falta arrancar nada) y el paquete de firmware.
          set -euo pipefail
          PKGDIR="${{ steps.paths.outputs.cache_dir }}/packages"
          # kupferbootstrap mete cada paquete en packages/<arch>/<repo>/ y con la
          # extension que tenga PKGEXT (aqui .pkg.tar.xz, no .zst), asi que se
          # busca en modo `find` y con comodin en la extension. Con un glob
          # `packages/*.pkg.tar.zst` este paso se murio en el run 36280135443
          # aunque los tres paquetes estuvieran construidos.
          # OJO el digito REQUIRED: el paquete del kernel genera
          # ademas linux-mt6785-headers-*, y con "$1-*" el find se queda con
          # ese en cuanto existe ("headers" ordena antes que el numero de
          # version). Al listar el headers no aparece ningun .ko y el verify
          # falla quejandose de modulos que si estan. pkgver siempre empieza
          # por un digito; un subpackage no.
          find_pkg() {
            find "$PKGDIR" -maxdepth 3 -type f -name "$1-*.pkg.tar.*" 2>/dev/null \
              | grep -E "/$1-[0-9]" \
              | sort | tail -1
          }
          KPKG=$(find_pkg linux-mt6785)
          if [ -z "$KPKG" ]; then
            echo "::error::no se encuentra linux-mt6785-*.pkg.tar.* en $PKGDIR"; exit 1
          fi
          echo "paquete del kernel: $KPKG"
          bsdtar -tf "$KPKG" > /tmp/kupfer-kernel-files.txt
          wc -l < /tmp/kupfer-kernel-files.txt
          # Un paquete de kernel sin ningun .ko es el paquete equivocado
          # (o el subpackage headers). Fallar aqui, con el nombre a la vista,
          # en vez de 24 errores de modulos mas abajo.
          if ! grep -q '\.ko' /tmp/kupfer-kernel-files.txt; then
            echo "::error::$KPKG no contiene ningun .ko: es el paquete equivocado"
            head -5 /tmp/kupfer-kernel-files.txt
            exit 1
          fi
          # Y que de verdad sea el paquete del kernel, no el de las cabeceras.
          if [[ "$(basename "$KPKG")" == *-headers-* ]]; then
            echo "::error::find_pkg devolvio el paquete de cabeceras: $KPKG"
            exit 1
          fi
          FPKG=$(find_pkg firmware-mt6785-xiaomi-begonia)
          if [ -z "$FPKG" ]; then
            echo "::error::no se encuentra firmware-mt6785-xiaomi-begonia-*.pkg.tar.* en $PKGDIR"; exit 1
          fi
          bsdtar -tf "$FPKG" > /tmp/kupfer-fw-files.txt
          echo "--- blobs de firmware ---"
          grep -E 'mediatek/|novatek/' /tmp/kupfer-fw-files.txt | sort

          missing=0
          # Los tres modulos del stack WiFi/BT interno de MediaTek. Sin ellos el
          # wifi del begonia no existe: el codigo esta en el arbol (rama
          # begonia-conn-wifi) pero hay que activarlo en el config.
          for m in wmt_drv wlan_gen4m mtk-vendor-btif; do
            if grep -qE "/${m}\.ko(\.[a-z0-9]+)?$" /tmp/kupfer-kernel-files.txt; then
              echo "OK mtk ${m}.ko"
            else
              echo "::error::el kernel no trae ${m}.ko (stack WiFi MediaTek)"
              missing=1
            fi
          done
          # Dongles: ethernet USB, wifi USB, BT USB y serie USB. Los nombres
          # de modulo NO coinciden con los del fuente (rtl8150.ko no r8150.ko,
          # mt76-usb.ko CON guion, rtw88_88xau.ko...).
          for m in asix ax88179_178a rtl8150 r8152 cdc_ether cdc_eem cdc_ncm \
                   dm9601 smsc95xx sierra_net rtl8xxxu rtw88_8812au rtw88_8821au \
                   rtw88_8822bu mt76-usb mt76x0u mt76x2u mt7921u \
                   btusb pl2303 ftdi_sio cp210x; do
            if grep -qE "/${m}\.ko(\.[a-z0-9]+)?$" /tmp/kupfer-kernel-files.txt; then
              echo "OK dongle ${m}.ko"
            else
              echo "::error::el kernel no trae ${m}.ko (ruta por dongle)"
              missing=1
            fi
          done
          # Firmware que necesita el stack MediaTek. Sin WMT_SOC.cfg el wmt_drv
          # no arranca; sin los soc1_0_*_2a_1_hdr.bin el conn-MCU no wakea. Van
          # comprimidos (.zst) porque asi estan en el repo de blobs; el kernel
          # los descomprime solo con CONFIG_FW_LOADER_COMPRESS_ZSTD=y, que es lo
          # que trae el config (viene de pmaports).
          for f in WMT_SOC.cfg.zst soc1_0_patch_mcu_2a_1_hdr.bin.zst \
                   soc1_0_ram_mcu_2a_1_hdr.bin.zst soc1_0_ram_wifi_2a_1_hdr.bin.zst \
                   soc1_0_ram_bt_2a_1_hdr.bin.zst WIFI_RAM_CODE_soc1_0_2a_1.bin.zst \
                   wifi.cfg.zst; do
            if grep -q "/${f}\$" /tmp/kupfer-fw-files.txt; then
              echo "OK fw ${f}"
            else
              echo "::error::falta el firmware ${f}"
              missing=1
            fi
          done
          # Panel y tactil: sin esto la pantalla no enciende en el 1er arranque.
          # Hay dos variantes (csot y tianma) y se instalan las dos.
          for f in nt36672a_begonia_csot.bin.zst nt36672a_begonia_tianma.bin.zst; do
            if grep -q "/${f}\$" /tmp/kupfer-fw-files.txt; then
              echo "OK fw ${f}"
            else
              echo "::error::falta el firmware ${f} (panel/tactil)"
              missing=1
            fi
          done
          # Y lo que de verdad importa: el DTB de 6.16 pide el nombre CSOT, asi
          # que ese fichero TIENE que ser el binario Tianma (md5 7d67c2e9...) o
          # el touch sale con los ejes invertidos. Un simple grep de nombres no
          # lo pilla: los dos ficheros existen siempre.
          csot_md5=$(bsdtar -xOf "$FPKG" "usr/lib/firmware/novatek/nt36672a_begonia_csot.bin.zst" | md5sum | cut -d' ' -f1)
          tianma_md5=$(bsdtar -xOf "$FPKG" "usr/lib/firmware/novatek/nt36672a_begonia_tianma.bin.zst" | md5sum | cut -d' ' -f1)
          echo "csot=$csot_md5 tianma=$tianma_md5"
          if [ "$csot_md5" != "7d67c2e9167f1a630576c177c1b831f7" ]; then
            echo "::error::el nombre CSOT no contiene el binario Tianma (touch invertido)"
            missing=1
          fi
          if [ "$tianma_md5" != "7d67c2e9167f1a630576c177c1b831f7" ]; then
            echo "::error::el binario Tianma no es el esperado"
            missing=1
          fi
          # Los modulos del panel tienen que estar en el paquete del kernel:
          # se cargan desde el initramfs, no desde la rootfs.
          for m in panel-novatek-nt36672a novatek-nvt-ts-spi ti-lmu \
                   lm363x-regulator lm36274_bl; do
            if grep -qE "/${m}\.ko(\.[a-z0-9]+)?$" /tmp/kupfer-kernel-files.txt; then
              echo "OK panel ${m}.ko"
            else
              echo "::error::el kernel no trae ${m}.ko (panel/tactil)"
              missing=1
            fi
          done
          # El servicio de arranque del stack MTK tiene que estar instalado y
          # habilitado. El symlink se crea a mano en el PKGBUILD porque en una
          # construccion de imagen no corre systemctl.
          # Ojo: el ancla `$` con sufijo de compresion opcional es lo que
          # distingue un modulo cargable de uno compilado dentro del kernel
          # (=y), que no aparece como fichero en el paquete y por tanto no se
          # puede modprobe. Sin esto el check daria por bueno un modulo que en
          # el movil no se puede cargar.
          DPKG=$(find_pkg device-mt6785-xiaomi-begonia)
          if [ -n "$DPKG" ]; then
            bsdtar -tf "$DPKG" > /tmp/kupfer-dev-files.txt
            for f in usr/lib/systemd/system/mediatek-wifi.service \
                     usr/libexec/mediatek-wifi.sh \
                     etc/kupfer/deviceinfo \
                     etc/kupfer/mkinitcpio.conf.d/xiaomi-begonia.conf \
                     boot/empty.dtbo \
                     etc/systemd/system/multi-user.target.wants/mediatek-wifi.service; do
              if grep -q "^${f}\$" /tmp/kupfer-dev-files.txt; then
                echo "OK dev ${f}"
              else
                echo "::error::el paquete del device no instala ${f}"
                missing=1
              fi
            done
          else
            echo "::error::no se encuentra el paquete device-mt6785-xiaomi-begonia"; missing=1
          fi
          exit "$missing"

      - name: Verify aboot.img header (v2 + recovery dtbo + cmdline)
        run: |
          # Esto es lo que decide si el movil arranca: el aboot de begonia
          # rechaza un boot.img v0/v1 cuando lleva DTB y recovery dtbo, y el
          # build puede salir verde sin que nadie mire la cabecera. Un
          # unpack_bootimg no viene en los runners, asi que se lee la
          # cabecera directamente (layout AOSP, estable desde 2011):
          #   0 magic[8] | 8 kernel_size | 12 kernel_addr | 16 ramdisk_size |
          #  20 ramdisk_addr | 24 second_size | 28 second_addr | 32 tags_addr |
          #  36 page_size | 40 header_version | 44 os_version | 48 name[16] |
          #  64 cmdline[512] | 576 id[32] | 608 extra_cmdline[1024] |
          #  1632 recovery_dtbo_size | 1636 recovery_dtbo_offset |
          #  1644 header_size | 1648 dtb_size | 1652 dtb_addr
          set -euo pipefail
          ABOOT="${{ steps.paths.outputs.images_dir }}/aboot.img"
          test -s "$ABOOT" || { echo "::error::no hay aboot.img que verificar"; exit 1; }
          python3 - "$ABOOT" <<'PY'
          import struct, sys

          d = open(sys.argv[1], "rb").read(1700)
          u32 = lambda o: struct.unpack_from("<I", d, o)[0]
          u64 = lambda o: struct.unpack_from("<Q", d, o)[0]
          bad = []

          if d[0:8] != b"ANDROID!":
              bad.append("magic = %r, no es ANDROID!" % d[0:8])
          hv = u32(40)
          if hv != 2:
              bad.append("header_version = %d, begonia con dtb exige 2" % hv)
          page = u32(36)
          if page not in (2048, 4096):
              bad.append("page_size = %d" % page)
          hsize = u32(1644)
          if hsize < 1644:
              bad.append("header_size = %d, no cabe la cabecera v2" % hsize)
          dtbo = u32(1632)
          if dtbo != 136:
              # 136 bytes es el empty.dtbo de pmaports. Sin el, el aboot de
              # begonia no encuentra el recovery dtbo y no arranca.
              bad.append("recovery_dtbo_size = %d, se esperaba 136 (empty.dtbo)" % dtbo)
          for f, o in (("kernel_size", 8), ("ramdisk_size", 16), ("dtb_size", 1648)):
              if u32(o) == 0:
                  bad.append("%s = 0" % f)
          # Las direcciones de carga tienen que ser las de pmapORTS: base
          # 0x40078000 + offsets. Si el base se pierde, el kernel no arranca.
          for f, o, want in (("kernel_addr", 12, 0x40080000),
                             ("ramdisk_addr", 20, 0x47C80000),
                             ("tags_addr", 32, 0x4BC80000),
                             ("dtb_addr", 1652, 0x4BC80000)):
              got = u32(o) if f != "dtb_addr" else u64(o)
              if got != want:
                  bad.append("%s = %#x, se esperaba %#x" % (f, got, want))
          cmd = d[64:576].rstrip(b"\0").decode("utf-8", "replace")
          for want in ("kupfer", "console=", "bootopt=64S3,32N2,64N2"):
              if want not in cmd:
                  bad.append("el cmdline no lleva %r" % want)
          # earlymodules= es UNA lista separada por comas, asi que buscar
          # "earlymodules=<mod>" no funciona: hay que partir el valor.
          mods = []
          for part in cmd.split():
              if part.startswith("earlymodules="):
                  mods = [m for m in part.split("=", 1)[1].split(",") if m]
          # Sin estos tres el panel no enciende en el primer arranque: se
          # cargan desde el initramfs antes de que haya rootfs.
          for want in ("novatek-nvt-ts-spi", "panel-novatek-nt36672a",
                       "ti-lmu", "lm363x-regulator", "lm36274_bl"):
              if want not in mods:
                  bad.append("earlymodules no lleva %r (lleva %s)"
                             % (want, ",".join(mods) or "nada"))
          if not mods:
              bad.append("el cmdline no tiene earlymodules=")

          print("aboot.img: %d bytes" % len(open(sys.argv[1], "rb").read()))
          print("  header_version=%d page_size=%d header_size=%d" % (hv, page, hsize))
          print("  kernel=%d ramdisk=%d dtb=%d recovery_dtbo=%d"
                % (u32(8), u32(16), u32(1648), dtbo))
          print("  cmdline: %s" % cmd)
          print("  earlymodules: %s" % ",".join(mods))
          if bad:
              for b in bad:
                  print("::error::aboot.img: %s" % b)
              sys.exit(1)
          print("aboot.img: cabecera v2 con recovery dtbo y cmdline correctos")
          PY

      - name: List images
        run: |
          ls -lh ${{ steps.paths.outputs.images_dir }} || true
          df -h / | tail -1
          # La particion `boot` de begonia es 64 MiB: si el boot.img no cabe,
          # el flasheo falla en el ultimo momento, con el device ya en fastboot.
          set -euo pipefail
          IMG_DIR="${{ steps.paths.outputs.images_dir }}"
          LIMIT=$((64 * 1024 * 1024))
          for f in "$IMG_DIR"/*-boot.img; do
            sz=$(stat -c%s "$f")
            echo "::group::$(basename "$f") = $sz bytes (limite $LIMIT)"
            [ "$sz" -le "$LIMIT" ] || { echo "::error::el boot.img no cabe en la particion boot de 64 MiB"; exit 1; }
            echo "cabe ($(( LIMIT - sz )) bytes de margen)"
            echo "::endgroup::"
          done
          # Y el filesystem de boot tiene que tener sitio de sobra para aboot.img.
          BOOT=$(ls "$IMG_DIR"/*-boot.img | head -1)
          MNT=/tmp/boot-check
          sudo mkdir -p "$MNT"
          sudo mount -o ro,loop "$BOOT" "$MNT"
          sudo du -sb "$MNT" | awk '{printf "contenido del boot fs: %d bytes\n", $1}'
          df -B1 --output=avail "$MNT" | tail -1 | awk '{printf "libre dentro del boot fs: %d bytes\n", $1}'
          sudo test -s "$MNT/aboot.img" || { echo "::error::aboot.img no esta en el boot fs"; exit 1; }
          sudo umount "$MNT"
          rmdir "$MNT" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kupfer-begonia-${{ inputs.flavour }}
          path: |
            ${{ steps.paths.outputs.images_dir }}/*.img
            ${{ steps.paths.outputs.images_dir }}/*.img.xz
            ${{ steps.paths.outputs.images_dir }}/aboot.img
            ${{ steps.paths.outputs.images_dir }}/aboot.bin
          retention-days: 7
          if-no-files-found: warn
